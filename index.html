<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>brekitdown-fe</title>
    <!-- Applies the resolved theme before first paint. Must stay in sync with
         THEME_STORAGE_KEY in src/features/theme/constants/theme.ts. -->
    <script>
      (function () {
        let resolvedTheme;

        try {
          resolvedTheme = localStorage.getItem("theme");
        } catch {
          /* Storage unavailable — continue with the system preference. */
        }

        if (resolvedTheme !== "light" && resolvedTheme !== "dark") {
          resolvedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        const root = document.documentElement;

        root.classList.add(resolvedTheme);
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
